<h1>{{ post.title }}</h1>
<p>Дата: {{ post.created_at|date:"d.m.Y H:i" }}</p>
<p>Просмотров: {{ post.views_count }}</p>
{% if post.preview_image %}
    <img src="{{ post.preview_image.url }}" alt="{{ post.title }}" width="300">
{% endif %}
<div>{{ post.content }}</div>
<a href="{% url 'blogpost_list' %}">Назад к списку</a>
<a href="{% url 'blogpost_update' post.pk %}">Редактировать</a>
<a href="{% url 'blogpost_delete' post.pk %}">Удалить</a>
