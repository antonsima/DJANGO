{% extends 'blog/base.html' %}
{% load static %}

{% block title %}Удаление {{ object.title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h2 class="mb-0">Подтверждение удаления</h2>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить запись <strong>"{{ object.title }}"</strong>? Это действие нельзя отменить.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'blog:blogpost_detail' object.pk %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
