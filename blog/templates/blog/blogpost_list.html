<h1>Блог</h1>
<a href="{% url 'blogpost_create' %}">Создать новую запись</a>
<ul>
{% for post in posts %}
    <li>
        <h2><a href="{% url 'blogpost_detail' post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.created_at|date:"d.m.Y" }}</p>
        <p>Просмотров: {{ post.views_count }}</p>
        <a href="{% url 'blogpost_update' post.pk %}">Редактировать</a>
        <a href="{% url 'blogpost_delete' post.pk %}">Удалить</a>
    </li>
{% endfor %}
</ul>
