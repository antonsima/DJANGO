{% extends 'catalog/base.html' %}
{% block content %}
{% include 'catalog/navigation.html' %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">{{ product.name }}</h1>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card mt-5">
                <div class="card-body">
                    <h4 class="card-title">Подтверждение действия</h4>
                    <p class="card-text">Вы действительно хотите снять с публикации "{{ product.name }}"?</p>

                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Подтвердить</button>
                    </form>

                    <a href="{% url 'catalog:products_list' %}" class="btn btn-primary">Отменить</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% include 'catalog/foot.html' %}

<script src="/static/js/bootstrap.bundle.min.js"></script>
{% endblock %}
